{% extends "base.html" %} {% block content %}
<div class="container mt-4">
    <div class="card shadow-sm border-0 p-4 mb-4">
        <h4 class="fw-bold"><i class="bi bi-plus-circle me-2"></i>Nueva Membresía</h4>
        <form method="POST" action="{{ url_for('comprar_membresia') }}" class="row g-3">
            <div class="col-md-3">
                <input type="text" name="nombre_cliente" class="form-control" placeholder="Nombre del Cliente" required>
            </div>
            <div class="col-md-3">
                <input type="text" name="telefono" class="form-control" placeholder="Teléfono" required>
            </div>
            <div class="col-md-3">
                <select name="tipo_membresia" class="form-select" required>
                    <option value="Mensual">Mensual</option>
                    <option value="Anual">Anual</option>
                </select>
            </div>
            <div class="col-md-2">
                <input type="number" name="pago" class="form-control" placeholder="Pago $" required>
            </div>
            <div class="col-md-1">
                <button type="submit" class="btn btn-primary w-100">Ok</button>
            </div>
        </form>
    </div>

    <div class="card shadow-sm border-0 p-4">
        <h5 class="fw-bold mb-3">Miembros Registrados</h5>
        <table class="table table-hover">
            <thead class="table-light">
                <tr>
                    <th>Nombre</th>
                    <th>Teléfono</th>
                    <th>Plan</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                {% for miembro in miembros %}
                <tr>
                    <td>{{ miembro.nombre }}</td>
                    <td>{{ miembro.telefono }}</td>
                    <td><span class="badge bg-info text-dark">{{ miembro.membresia }}</span></td>
                    <td>{{ miembro.fecha_inscripcion }}</td>
                    <td><span class="badge bg-success">Activo</span></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
